# Railway terminates TLS; tell PHP the original request was HTTPS.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Silences AH00558; requests carry the real Host header.
ServerName localhost

# Behind Railway's proxy REMOTE_ADDR is a rotating 100.64.0.x address; PrestaShop's cookie IP check
# then logs the user out right after login. Use the client IP from X-Forwarded-For instead.
<IfModule remoteip_module>
  RemoteIPHeader X-Forwarded-For
  RemoteIPInternalProxy 100.64.0.0/10
</IfModule>
