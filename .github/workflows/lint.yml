name: Lint
on:
  pull_request:

permissions:
  contents: read
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scss: ${{ steps.filter.outputs.scss }}
      js: ${{ steps.filter.outputs.js }}
      yaml: ${{ steps.filter.outputs.yaml }}
      php: ${{ steps.filter.outputs.php }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Filter changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > files.txt
          flag() { if grep -Eq "$2" files.txt; then echo "$1=true" >> "$GITHUB_OUTPUT"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          flag scss '^admin-dev/themes/.*\.scss$|^admin-dev/themes/.*/package(-lock)?\.json$|^themes/.*\.scss$'
          flag js '^admin-dev/themes/(default|new-theme)/'
          flag yaml '^(app|src|\.github)/.*\.ya?ml$|^\.t9n\.yml$'
          flag php '\.php$|\.twig$|\.tpl$|\.ya?ml$|^composer\.(json|lock)$|^\.header-stamp'
          flag workflow '^\.github/(workflows/lint\.yml|actions/)'

  stylelint:
    name: SCSS Lint
    needs: changes
    if: needs.changes.outputs.scss == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '16.x'

      - name: BackOffice Theme `new-theme`
        run: cd ./admin-dev/themes/new-theme && npm ci && npm run scss-lint

      - name: BackOffice Theme `default`
        run: cd ./admin-dev/themes/default && npm ci && npm run scss-lint

  eslint:
    name: ESLint
    needs: changes
    if: needs.changes.outputs.js == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '16.x'

      - name: Validate npm config
        run: >-
            (cd admin-dev/themes/default && npm ci)
            && (cd admin-dev/themes/new-theme && npm ci)
            && (cd themes && npm ci)

      - name: BackOffice Theme `default`
        run: cd ./admin-dev/themes/default && npm ci && npm run lint

      - name: BackOffice Theme `new-theme`
        run: cd ./admin-dev/themes/new-theme && npm ci && npm run lint

  yamllint_sf:
    name: YAML Lint (Symfony Check)
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv, simplexml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Directory
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer Install
        run: COMPOSER_PROCESS_TIMEOUT=600 composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Run Lint Yaml on `app`
        run: php bin/console lint:yaml app --parse-tags

      - name: Run Lint Yaml on `src` tags are allowed
        run: php bin/console lint:yaml src --parse-tags

      - name: Run Lint Yaml on `.t9n.yml`
        run: php bin/console lint:yaml .t9n.yml

  yamllint:
    name: YAML Lint (YamlLint Check)
    needs: changes
    if: needs.changes.outputs.yaml == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAMLLint
        run: |
          pip install --user yamllint
      - uses: actions/checkout@v5

      - name: yamllint on `.github`
        run: yamllint -c .github/workflows/yamllint/.yamllint.yml .github

      - name: yamllint on `app`
        run: yamllint -c .github/workflows/yamllint/.yamllint.yml app

      - name: yamllint on `src`
        run: yamllint -c .github/workflows/yamllint/.yamllint.yml src

      - name: yamllint on `.t9n.yml`
        run: yamllint -c .github/workflows/yamllint/.yamllint.yml .t9n.yml

  legacy_link_lint:
    name: Legacy Link Lint
    needs: changes
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          extensions: mbstring, intl, gd, xml, dom, json, fileinfo, curl, zip, iconv, simplexml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v5

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Directory
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Composer Install
        run: COMPOSER_PROCESS_TIMEOUT=600 composer install --ansi --prefer-dist --no-interaction --no-progress

      - name: Run Legacy Link Lint
        run: php bin/console prestashop:linter:legacy-link

  security_attribute_lint:
    name: Admin Security Attribute Linter
    needs: changes
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Prepare docker prefix with repository name lower cased
        run: |
          REPOSITORY_NAME=${{ github.event.repository.name }}
          echo "DOCKER_PREFIX=${REPOSITORY_NAME@L}" >> $GITHUB_ENV

      - uses: actions/checkout@v5

      # First install the shop to that the modules controllers are also scanned (not the case without installation)
      - name: Setup Environment
        timeout-minutes: 15
        uses: ./.github/actions/setup-env
        with:
          PHP_VERSION: 8.1
          ENABLE_SSL: 'true'
          INSTALL_AUTO: 'true'
          DISABLE_MAKE: 'false'
      - name: Setup Environment failure
        uses: ./.github/actions/setup-env-export-logs
        with:
          DOCKER_PREFIX: ${{ env.DOCKER_PREFIX }}
          ARTIFACT_NAME: setup-symfony-console-${{ matrix.app-id }}
          ENABLE_SSL: 'true'
          INSTALL_AUTO: 'true'
        if: failure()

      - name: Run Admin Security Attribute Linter (inside the docker so installed modules are also scanned)
        run: |
          echo Searching for routes without security
          docker exec ${{ env.DOCKER_PREFIX }}-prestashop-git-1 php bin/console prestashop:linter:security-attribute find-missing

  header-stamp:
    name: Check license headers
    needs: changes
    if: needs.changes.outputs.php == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Composer cache
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache Composer Directory
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Composer Install
        run: COMPOSER_PROCESS_TIMEOUT=600 composer install --ansi --prefer-dist --no-interaction --no-progress

      # Run header stamp
      - name: Header stamp dry run
        run: composer header-stamp
      # Little hint to help contributors fix their PRs
      - name: Hint to fix
        if: failure()
        run: echo "::notice::Run composer header-stamp-fix at the root of the project to fix files, or update the .header-stamp-config.yml file to add exceptions"
