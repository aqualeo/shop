name: VPS Docker build
on:
  push:
    branches: [ develop ]
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.railway/**'
      - '.github/workflows/vps-build.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  docker-build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --pull -t shop-ci:${{ github.sha }} .

      - name: Remove image
        if: always()
        run: docker image rm shop-ci:${{ github.sha }} || true
